<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>git-notes Extension</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #24292e;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #d1d5da;
      display: inline-block;
    }
    .status-dot.connected {
      background-color: #28a745;
    }
    .status-dot.error {
      background-color: #cb2431;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #d1d5da;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #0366d6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(3,102,214,0.3);
    }
    button {
      background-color: #2ea44f;
      color: white;
      border: 1px solid rgba(27,31,35,0.15);
      border-radius: 6px;
      padding: 5px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #2c974b;
    }
    #status-msg {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>
    git-notes settings
    <span id="connection-dot" class="status-dot" title="Checking connection..."></span>
  </h1>
  
  <div class="form-group">
    <label for="bridge-url">Bridge API URL</label>
    <input type="text" id="bridge-url" placeholder="http://localhost:7477">
  </div>
  
  <div class="form-group">
    <label for="token">Access Token (Optional)</label>
    <input type="password" id="token" placeholder="Optional Bearer token">
  </div>
  
  <button id="save-btn">Save</button>
  
  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
