name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true   # warn only for v0.1.x

      - name: Clippy (warnings allowed for v0.1.x)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true   # will be enforced from v0.2.0

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Typecheck vscode-ext
        run: bun run typecheck
        working-directory: packages/vscode-ext
        continue-on-error: true

      - name: Typecheck chrome-ext
        run: bun run typecheck
        working-directory: packages/chrome-ext
        continue-on-error: true

      - name: Typecheck web-viewer
        run: bun run typecheck
        working-directory: packages/web-viewer
        continue-on-error: true

      - name: Build vscode-ext
        run: bun run build
        working-directory: packages/vscode-ext
        continue-on-error: true

      - name: Build web-viewer
        run: bun run build
        working-directory: packages/web-viewer
        continue-on-error: true

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/github-bridge/go.sum

      - name: Go Vet
        run: go vet ./...
        working-directory: services/github-bridge

      - name: Go Build
        run: go build ./...
        working-directory: services/github-bridge

      - name: Go Test
        run: go test ./...
        working-directory: services/github-bridge

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: python/gn_hooks

      - name: Run tests
        run: python -m pytest --tb=short -q || true
        working-directory: python/gn_hooks
