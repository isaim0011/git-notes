name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-rust:
    name: Build Rust Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: git-notes-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: git-notes-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: git-notes-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: git-notes-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/git-notes.exe ${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/git-notes ${{ matrix.artifact_name }}
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  package-vscode:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./vscode-extension
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Package VSIX
        run: vsce package
        working-directory: ./vscode-extension
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: ./vscode-extension/*.vsix

  package-chrome:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./chrome-extension
      - name: Build
        run: npm run build
        working-directory: ./chrome-extension
      - name: Zip extension
        run: zip -r git-notes-chrome.zip dist/
        working-directory: ./chrome-extension
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: ./chrome-extension/git-notes-chrome.zip

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/github-bridge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/github-bridge:${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: [build-rust, package-vscode, package-chrome, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            git-notes-*/*
            vscode-extension/*.vsix
            chrome-extension/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish Python Package
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and twine
        run: pip install build twine
      - name: Build and Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python/gn_hooks
          python -m build
          twine upload dist/*
