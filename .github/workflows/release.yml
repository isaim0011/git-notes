name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Rust Binaries ────────────────────────────────────────────────────────────
  build-rust:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: git-notes
            artifact_name: git-notes-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: git-notes.exe
            artifact_name: git-notes-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: git-notes
            artifact_name: git-notes-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: git-notes
            artifact_name: git-notes-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin git-notes --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact_name }}

      - name: Stage artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" "${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ── VS Code Extension ─────────────────────────────────────────────────────────
  package-vscode:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: packages/vscode-ext
      - run: bunx @vscode/vsce package --no-dependencies
        working-directory: packages/vscode-ext
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: packages/vscode-ext/*.vsix
          if-no-files-found: ignore

  # ── Chrome Extension ──────────────────────────────────────────────────────────
  package-chrome:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: packages/chrome-ext
      - run: bun run build
        working-directory: packages/chrome-ext
        continue-on-error: true
      - name: Zip extension
        run: zip -r git-notes-chrome.zip dist/ || true
        working-directory: packages/chrome-ext
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: packages/chrome-ext/git-notes-chrome.zip
          if-no-files-found: ignore

  # ── Docker ────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./services/github-bridge
          file: ./services/github-bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/github-bridge:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/github-bridge:latest

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── crates.io ─────────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish gn-core
        run: cargo publish -p gn-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
      - run: sleep 30
      - name: Publish gn-sync
        run: cargo publish -p gn-sync --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
      - run: sleep 30
      - name: Publish gn-cli
        run: cargo publish -p gn-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  # ── PyPI ──────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - name: Build and upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python/gn_hooks
          python -m build
          twine upload dist/*
        continue-on-error: true
