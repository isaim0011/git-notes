name: Cross-Post Release Announcements

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-blogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Dev.to Publishing
      - name: Publish to Dev.to
        uses: sinedied/publish-devto@v2
        if: env.DEVTO_TOKEN != ''
        env:
          DEVTO_TOKEN: ${{ secrets.DEVTO_TOKEN }}
        with:
          devto_key: ${{ secrets.DEVTO_TOKEN }}
          files: 'docs/announcements/*.md'

      # 2. Hashnode Publishing
      - name: Publish to Hashnode
        uses: Hashnode/publish-github-action@v1
        if: env.HASHNODE_PAT != ''
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
        with:
          access-token: ${{ secrets.HASHNODE_PAT }}
          publication-host: ${{ secrets.HASHNODE_HOST }}
          posts-directory: 'docs/announcements'

      # 3. Reddit Release Announcement
      - name: Post to Reddit (r/rust & r/git)
        uses: bluwy/release-for-reddit-action@v1
        if: env.REDDIT_APP_ID != ''
        env:
          REDDIT_APP_ID: ${{ secrets.REDDIT_APP_ID }}
        with:
          username: ${{ secrets.REDDIT_USERNAME }}
          password: ${{ secrets.REDDIT_PASSWORD }}
          app-id: ${{ secrets.REDDIT_APP_ID }}
          app-secret: ${{ secrets.REDDIT_APP_SECRET }}
          subreddit: 'rust'
          title: 'git-notes ${{ github.event.release.tag_name || "v0.1.8" }}: Decentralized code reviews & offline P2P sync in Git'
