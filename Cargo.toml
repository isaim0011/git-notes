[workspace]
members = ["crates/gn-core", "crates/gn-sync", "crates/gn-cli", "crates/gn-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bimo <i.s41m0011@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/isaim0011/git-notes"
homepage = "https://github.com/isaim0011/git-notes"
documentation = "https://docs.rs/gn-core"
keywords = ["git", "notes", "code-review", "comments", "decentralized"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
gix = "0.66"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.36", features = ["full"] }
pretty_assertions = "1.4"
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.26"
crossterm = "0.27"
syntect = "5.2"
md5 = "0.7"
