<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .terminal { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #cdd6f4; }
    .prompt { fill: #89b4fa; font-weight: bold; }
    .cmd { fill: #a6e3a1; font-weight: 600; }
    .flag { fill: #f9e2af; }
    .str { fill: #fab387; }
    .success { fill: #a6e3a1; font-weight: bold; }
    .dim { fill: #6c7086; }
    .cyan { fill: #94e2d5; }
    .magenta { fill: #cba6f7; }
    .yellow { fill: #f9e2af; }
    .white { fill: #cdd6f4; font-weight: bold; }
    .cursor { fill: #89b4fa; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Keyframe Animations for progressive reveal */
    .step1 { animation: fadeIn 0.4s ease 0.5s both; }
    .step2 { animation: fadeIn 0.4s ease 1.5s both; }
    .step3 { animation: fadeIn 0.4s ease 2.5s both; }
    .step4 { animation: fadeIn 0.4s ease 3.5s both; }
    .step5 { animation: fadeIn 0.4s ease 4.5s both; }
    .step6 { animation: fadeIn 0.4s ease 5.5s both; }
    .step7 { animation: fadeIn 0.4s ease 6.5s both; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <g filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect x="20" y="20" width="800" height="460" rx="12" fill="url(#bodyGrad)" stroke="#313244" stroke-width="1.5" />

    <!-- Terminal Header Bar -->
    <path d="M 20 32 Q 20 20 32 20 L 808 20 Q 820 20 820 32 L 820 54 L 20 54 Z" fill="url(#headerGrad)" />
    <line x1="20" y1="54" x2="820" y2="54" stroke="#313244" stroke-width="1.5" />

    <!-- Window Controls -->
    <circle cx="42" cy="37" r="6" fill="#f38ba8" />
    <circle cx="62" cy="37" r="6" fill="#f9e2af" />
    <circle cx="82" cy="37" r="6" fill="#a6e3a1" />

    <!-- Window Title -->
    <text x="420" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a6adc8">
      git-notes — decentralized code comments
    </text>
  </g>

  <g class="terminal" transform="translate(45, 85)">
    <!-- Command 1: Add a note -->
    <g class="step1">
      <text x="0" y="0">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd">git-notes add </tspan>
        <tspan class="flag">-f </tspan><tspan class="cyan">src/engine.rs </tspan>
        <tspan class="flag">-l </tspan><tspan class="yellow">42 </tspan>
        <tspan class="flag">-m </tspan><tspan class="str">"Why is this O(n²)?"</tspan>
      </text>
    </g>

    <!-- Output 1 -->
    <g class="step2">
      <text x="0" y="24">
        <tspan class="success">✓ </tspan>
        <tspan fill="#a6adc8">Note </tspan>
        <tspan class="cyan">72818dac </tspan>
        <tspan fill="#a6adc8">added to </tspan>
        <tspan class="magenta">refs/notes/comments </tspan>
        <tspan class="dim">(zero commit rewrite)</tspan>
      </text>
    </g>

    <!-- Command 2: Reply to note -->
    <g class="step3">
      <text x="0" y="64">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd">git-notes reply </tspan>
        <tspan class="cyan">72818dac </tspan>
        <tspan class="flag">-m </tspan><tspan class="str">"Refactored to O(1) HashMap lookup in #12"</tspan>
      </text>
    </g>

    <!-- Output 2 -->
    <g class="step4">
      <text x="0" y="88">
        <tspan class="success">✓ </tspan>
        <tspan fill="#a6adc8">Reply </tspan>
        <tspan class="cyan">d325a67a </tspan>
        <tspan fill="#a6adc8">linked to thread </tspan>
        <tspan class="cyan">72818dac </tspan>
        <tspan class="dim">[status: Open]</tspan>
      </text>
    </g>

    <!-- Command 3: Show thread -->
    <g class="step5">
      <text x="0" y="128">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd">git-notes show </tspan>
        <tspan class="cyan">72818dac </tspan>
        <tspan class="flag">--thread</tspan>
      </text>
    </g>

    <!-- Output 3: Formatted Thread Card -->
    <g class="step6">
      <!-- Thread Box -->
      <rect x="0" y="145" width="750" height="155" rx="8" fill="#181825" stroke="#313244" stroke-width="1" />
      
      <text x="16" y="172">
        <tspan class="dim">ID:       </tspan><tspan class="cyan">72818dac-a4bf-4099-b322-40e0534221e7</tspan>
        <tspan x="480" class="dim">Commit: </tspan><tspan class="magenta">36303fd (main)</tspan>
      </text>
      <text x="16" y="194">
        <tspan class="dim">File:     </tspan><tspan class="yellow">src/engine.rs:42</tspan>
        <tspan x="480" class="dim">Status: </tspan><tspan class="success">● Open</tspan>
      </text>
      <text x="16" y="216">
        <tspan class="dim">Author:   </tspan><tspan fill="#cdd6f4">Alice &lt;alice@dev.org&gt; · 10m ago</tspan>
      </text>
      <text x="16" y="240" class="white">
        Why is this O(n²)?
      </text>

      <!-- Thread Reply separator -->
      <line x1="16" y1="254" x2="734" y2="254" stroke="#313244" stroke-dasharray="4" />

      <text x="16" y="274">
        <tspan class="magenta">  └─ Reply </tspan>
        <tspan class="dim">by </tspan><tspan fill="#cdd6f4">Bob &lt;bob@dev.org&gt; · 2m ago</tspan>
      </text>
      <text x="42" y="292" fill="#a6adc8">
        Refactored to O(1) HashMap lookup in #12
      </text>
    </g>

    <!-- Command 4: Launch TUI / Sync -->
    <g class="step7">
      <text x="0" y="335">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd">git-notes sync push </tspan>
        <tspan class="dim">&amp;&amp; </tspan>
        <tspan class="cmd">git-notes-tui</tspan>
      </text>
      <text x="0" y="358">
        <tspan class="success">✓ </tspan>
        <tspan fill="#a6adc8">Synced 2 notes to origin/refs/notes/* (0 conflicts)</tspan>
      </text>
      <text x="0" y="378">
        <tspan class="cyan">🚀 Launching interactive Terminal UI...</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>
  </g>
</svg>
