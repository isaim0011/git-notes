<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" filter="url(#glow)" />

  <!-- Git branch curve -->
  <path d="M 36 32 L 36 96" stroke="#45475a" stroke-width="6" stroke-linecap="round" />
  <path d="M 36 64 C 36 64, 48 64, 60 76 C 68 84, 76 84, 88 84" stroke="url(#gitGrad)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Git nodes -->
  <circle cx="36" cy="36" r="8" fill="#313244" stroke="#cdd6f4" stroke-width="4" />
  <circle cx="36" cy="92" r="8" fill="#313244" stroke="#cdd6f4" stroke-width="4" />
  <circle cx="92" cy="84" r="8" fill="#f43f5e" stroke="#fff" stroke-width="3" />

  <!-- Note / Speech bubble badge -->
  <g transform="translate(48, 22)">
    <path d="M 8 0 L 52 0 C 56.4 0, 60 3.6, 60 8 L 60 40 C 60 44.4, 56.4 48, 52 48 L 24 48 L 12 58 L 12 48 L 8 48 C 3.6 48, 0 44.4, 0 40 L 0 8 C 0 3.6, 3.6 0, 8 0 Z" fill="url(#bubbleGrad)" filter="url(#glow)" />
    <!-- Note text lines inside bubble -->
    <line x1="14" y1="16" x2="46" y2="16" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="14" y1="26" x2="38" y2="26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="14" y1="36" x2="28" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
